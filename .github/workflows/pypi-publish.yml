name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/llmrivotril
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify release tag comes from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Expected a tag ref, got ${GITHUB_REF_TYPE:-unknown}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            echo "Release tag must start with v: ${GITHUB_REF_NAME:-unknown}." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit reachable from main." >&2
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME is based on main."

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/constraints-ci.txt build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
