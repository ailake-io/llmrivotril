name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/llmrivotril
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify release tag comes from main
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with v: $RELEASE_TAG." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release tag $RELEASE_TAG does not point to a commit reachable from main." >&2
            exit 1
          fi
          echo "Release tag $RELEASE_TAG is based on main."

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/constraints-ci.txt build twine
          python -m build
          twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
