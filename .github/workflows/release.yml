name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-latest
    # Configure this environment's protection rules (required reviewers,
    # wait timer) in Settings -> Environments to gate the actual upload step
    # behind manual approval -- switching from Trusted Publishing to a
    # static API token removed OIDC's per-run, unexfiltratable credential;
    # an approval gate is the mitigation for that trade-off.
    environment:
      name: pypi
      url: https://pypi.org/p/llmrivotril
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify release tag comes from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            echo "Expected a tag ref, got ${GITHUB_REF_TYPE:-unknown}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME:-}" != v* ]]; then
            echo "Release tag must start with v: ${GITHUB_REF_NAME:-unknown}." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit reachable from main." >&2
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME is based on main."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c .github/constraints-ci.txt build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
