name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: Build and publish distributions
    runs-on: ubuntu-latest
    # Configure this environment's protection rules (required reviewers,
    # wait timer) in Settings -> Environments to gate the actual upload step
    # behind manual approval -- switching from Trusted Publishing to a
    # static API token removed OIDC's per-run, unexfiltratable credential;
    # an approval gate is the mitigation for that trade-off.
    environment:
      name: pypi
      url: https://pypi.org/p/llmrivotril
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
