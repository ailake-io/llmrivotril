[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "llmrivotril"
version = "0.5.0"
description = "A lightweight framework to reduce LLM hallucinations, enforce guardrails, manage stateful memory, and monitor performance via local dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "instructor>=1.0.0",
    "openai>=1.0.0,<2.0.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "click>=8.0.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tomli>=1.2.0; python_version < '3.11'"
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
]
anthropic = [
    "anthropic>=0.25.0",
]
cohere = [
    "cohere>=5.0.0",
]
gemini = [
    "google-generativeai>=0.7.0",
]
providers = [
    "llmrivotril[anthropic,cohere,gemini]",
]
rag = [
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
]
ci = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
dev = [
    "llmrivotril[ci,providers,semantic]"
]

[project.scripts]
llmrivotril = "llmrivotril.cli:cli"

[project.urls]
Homepage = "https://github.com/ailake-io/llmrivotril"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4"]

[tool.mypy]
# Use 3.12 here only so mypy can parse modern third-party stubs (e.g. numpy 2.x)
# while the package itself remains compatible with Python 3.10+.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "scipy.*",
    "sklearn.*",
    "instructor.*",
    "bs4.*",
    "pypdf.*",
    "tomli.*",
    "google.*",
]
ignore_missing_imports = true
