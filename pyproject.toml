[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "llmrivotril"
version = "0.1.2"
description = "A lightweight framework to reduce LLM hallucinations, enforce guardrails, manage stateful memory, and monitor performance via local dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thiago Egon Lange", email = "contato@dadosidados.net.br" }
]
keywords = ["llm", "language-models", "guardrails", "rag", "hallucination", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0.0",
    "instructor>=1.0.0",
    "openai>=2.0.0,<3.0.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "click>=8.0.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tomli>=1.2.0; python_version < '3.11'"
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
]
anthropic = [
    "anthropic>=0.25.0",
]
cohere = [
    "cohere>=5.0.0",
]
gemini = [
    "google-genai>=1.0.0",
]
bedrock = [
    "boto3>=1.28.0",
]
providers = [
    "anthropic>=0.25.0",
    "cohere>=5.0.0",
    "google-genai>=1.0.0",
    "boto3>=1.28.0",
]
rag = [
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
]
redis = [
    "redis>=5.0.0",
]
pgvector = [
    "psycopg[binary]>=3.1.0",
]
qdrant = [
    "qdrant-client>=1.10.0",
]
weaviate = [
    "weaviate-client>=4.4.0",
]
pinecone = [
    "pinecone>=10.0.0",
]
vector-stores = [
    "sentence-transformers>=2.2.0",
    "psycopg[binary]>=3.1.0",
    "qdrant-client>=1.10.0",
    "weaviate-client>=4.4.0",
    "pinecone>=10.0.0",
]
crewai = [
    "crewai>=1.0.0,<2.0.0",
]
langchain = [
    "langchain-core>=0.3.0",
]
adk = [
    "google-adk>=1.0.0",
]
autogen = [
    "ag2>=1.0.0,<2.0.0",
]
integrations = [
    "crewai>=1.0.0,<2.0.0",
    "langchain-core>=0.3.0",
    "google-adk>=1.0.0",
    "ag2>=1.0.0,<2.0.0",
]
ci = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "anthropic>=0.25.0",
    "cohere>=5.0.0",
    "google-genai>=1.0.0",
    "boto3>=1.28.0",
    "sentence-transformers>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "qdrant-client>=1.10.0",
    "weaviate-client>=4.4.0",
    "pinecone>=10.0.0",
    "crewai>=1.0.0,<2.0.0",
    "langchain-core>=0.3.0",
    "google-adk>=1.0.0",
    "ag2>=1.0.0,<2.0.0",
]

[project.scripts]
llmrivotril = "llmrivotril.cli:cli"

[project.urls]
Homepage = "https://github.com/ailake-io/llmrivotril"
Repository = "https://github.com/ailake-io/llmrivotril"
Issues = "https://github.com/ailake-io/llmrivotril/issues"
Documentation = "https://github.com/ailake-io/llmrivotril/tree/main/docs"
Changelog = "https://github.com/ailake-io/llmrivotril/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
# Hatchling's default sdist inclusion doesn't respect .git/info/exclude (a
# local-only ignore file, unlike the tracked .gitignore) and includes
# whatever else sits in the working directory -- caught a local Claude Code
# state file and a scratch venv leaking into a real build. Exclude those
# classes of local-only artifacts explicitly rather than relying on VCS
# ignore rules the build tool doesn't fully honor.
exclude = [
    "/.claude",
    "/.venv*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4"]

[tool.mypy]
# Use 3.12 here only so mypy can parse modern third-party stubs (e.g. numpy 2.x)
# while the package itself remains compatible with Python 3.10+.
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Every module here is an optional runtime dependency, imported lazily
# behind a try/except ImportError. ignore_missing_imports covers both "not
# installed at all" (import-not-found, the case in CI's `.[ci]` env) and
# "installed but has no stubs/py.typed" (import-untyped, the case in a
# `.[dev]` env with everything installed) uniformly -- an inline
# `# type: ignore[import-not-found]` at the import site only suppresses the
# first of those and starts erroring again the moment the package is
# actually installed with no stubs, so prefer adding here over inline
# ignores for any new optional dependency.
module = [
    "numpy.*",
    "sentence_transformers.*",
    "torch.*",
    "transformers.*",
    "scipy.*",
    "sklearn.*",
    "instructor.*",
    "bs4.*",
    "pypdf.*",
    "tomli.*",
    "google.*",
    "anthropic.*",
    "cohere.*",
    "boto3.*",
    "redis.*",
    "psycopg.*",
    "qdrant_client.*",
    "weaviate.*",
    "pinecone.*",
    "crewai.*",
    "langchain_core.*",
    "ag2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These adapters subclass an optional framework's base class (CrewAI's
# BaseLLM, LangChain's BaseChatModel, ADK's BaseLlm). When that framework
# isn't installed (the case in CI's `.[ci]` env), ignore_missing_imports
# above types the base class as `Any`, and mypy's disallow_subclassing_any
# (part of `strict`) then flags the class definition itself -- a check
# that's valuable elsewhere but meaningless here, since the whole point of
# each module is to subclass a class that only exists behind an optional
# extra. Disabling just that error code for these three files avoids an
# inline ignore that would flip to "unused" the moment the extra is
# actually installed (the same fragility class as the numpy import above).
module = [
    "llmrivotril.integrations.crewai",
    "llmrivotril.integrations.langchain",
]
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# Same "misc" reasoning as above, plus: ADK's BaseLlm is a pydantic model,
# and RivotrilLlm.__init__ passes this subclass's own `agent` field to
# super().__init__() (pydantic validates against the full subclass field
# set at runtime regardless of the literal super() call), but mypy only
# knows BaseLlm's own fields there and flags it as an unexpected kwarg
# ("call-arg").
module = ["llmrivotril.integrations.adk"]
disable_error_code = ["misc", "call-arg"]
